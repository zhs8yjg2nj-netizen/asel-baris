<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Asel ❤️ Barış</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at bottom, #0a0a1a, #000);
  color: #fff;
  overflow-x: hidden;
}

/* YILDIZLI ARKA PLAN */
.stars {
  position: fixed;
  width: 100%;
  height: 100%;
  background: url("https://raw.githubusercontent.com/JulianLaval/canvas-particle-network/master/img/bg.png");
  animation: moveStars 120s linear infinite;
  z-index: -2;
}
@keyframes moveStars {
  from { background-position: 0 0; }
  to { background-position: -10000px 5000px; }
}

/* KALPLER */
.heart {
  position: fixed;
  bottom: -20px;
  font-size: 20px;
  color: #ff4d6d;
  animation: float 6s linear infinite;
}
@keyframes float {
  to {
    transform: translateY(-110vh);
    opacity: 0;
  }
}

.container {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(14px);
  border-radius: 24px;
  padding: 35px 25px;
  width: 90%;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 25px 60px rgba(0,0,0,0.5);
}

h1 {
  font-size: 28px;
  margin-bottom: 10px;
}

p {
  font-size: 16px;
  line-height: 1.6;
}

.counter {
  margin: 20px 0;
  font-size: 15px;
  opacity: 0.9;
}

.gallery img {
  width: 100%;
  border-radius: 18px;
  margin: 10px 0;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

.btn {
  display: block;
  margin: 12px 0;
  padding: 14px;
  width: 100%;
  background: #fff;
  color: #000;
  border: none;
  border-radius: 30px;
  font-weight: bold;
  font-size: 15px;
}

.secret {
  margin-top: 25px;
  cursor: pointer;
  font-size: 14px;
  opacity: 0.85;
}

.secret span {
  display: none;
  margin-top: 10px;
  font-size: 16px;
  color: #ffb3c1;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="container">
  <div class="card">

    <h1>Asel ❤️ Barış</h1>

    <p>
      Bazı geceler vardır…<br>
      Yıldızlar bile kıskanır.<br>
      <strong>Çünkü sen yanımdasındır.</strong>
    </p>

    <div class="counter" id="days"></div>

    <div class="gallery">
      <img src="foto1.jpg">
      <img src="foto2.jpg">
      <img src="foto3.jpg">
    </div>

    <button class="btn" onclick="playMusic()">Şarkıyı Başlat 💖</button>

    <div class="secret" onclick="reveal()">
      💫 Gizli Mesaj
      <span id="msg">BONCUĞUMU ÇOK SEVİYORUMMM</span>
    </div>

  </div>
</div>

<audio id="music" loop>
  <source src="https://files.freemusicarchive.org/storage-freemusicarchive-org/music/no_curator/Baro/Single/Baro_-_Ihtiyaci_Var.mp3" type="audio/mpeg">
</audio>

<script>
// TANISMA TARIHI → 24 AĞUSTOS 2025
const startDate = new Date("2025-08-24");
const today = new Date();
const diffTime = today - startDate;
const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

document.getElementById("days").innerHTML =
  `24.08.2025’ten beri<br><strong>${diffDays}</strong> gündür kalbimdesin 🖤`;

// GIZLI MESAJ
function reveal() {
  document.getElementById("msg").style.display = "block";
}

// MUZIK
function playMusic() {
  const music = document.getElementById("music");
  music.play();
}

// KALP ANIMASYONU
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 20 + 10) + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 6000);
}, 500);
</script>

</body>
</html>
